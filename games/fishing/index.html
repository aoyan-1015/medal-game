<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>釣りメダルゲーム | メダルカジノ</title>
<link rel="stylesheet" href="../../shared/theme.css" />
<link rel="stylesheet" href="fishing.css" />
</head>
<body>
  <div id="app-header"></div>

  <main>
    <h1 class="page-title">🎣 釣りメダルゲーム</h1>

    <div class="layout">
      <section class="panel pond-panel">
        <div class="pond" id="pond">
          <div class="ripple" id="ripple"></div>
          <div class="fish-icon" id="fish-icon">🐟</div>
        </div>
        <p class="pond-status" id="pond-status">仕掛けを投げて魚を待とう。</p>

        <div class="reel-wrap hidden" id="reel-wrap">
          <div class="reel-bar-bg"><div class="reel-bar" id="reel-bar"></div></div>
          <button class="btn btn-primary reel-btn" id="reel-btn">🎣 巻く！</button>
        </div>

        <button class="btn btn-primary cast-btn" id="cast-btn">🎣 仕掛けを投げる（5枚）</button>
      </section>

      <section class="panel control-panel">
        <h2>図鑑</h2>
        <div class="fish-collection" id="fish-collection"></div>
      </section>
    </div>
  </main>

  <script src="../../shared/medal-bank.js"></script>
  <script src="../../shared/jp-tickets.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.52.1"></script>
  <script src="../../shared/supabase-config.js"></script>
  <script src="../../shared/ranking.js"></script>
  <script src="../../shared/header.js"></script>
  <script src="fishing.js"></script>
</body>
</html>
