<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ビンゴボール抽選 | メダルカジノ</title>
<link rel="stylesheet" href="../../shared/theme.css" />
<link rel="stylesheet" href="bingo-ball.css" />
</head>
<body>
  <div id="app-header"></div>

  <main>
    <h1 class="page-title">🎱 ビンゴボール抽選</h1>

    <div class="layout">
      <section class="panel field-panel">
        <canvas id="field" width="480" height="450"></canvas>
      </section>

      <section class="panel control-panel">
        <h2>ビンゴカード</h2>
        <div class="bingo-card" id="bingo-card"></div>
        <p class="reach-banner" id="reach-banner"></p>
        <p class="hint" id="game-hint">「スタート」でカードを配り、ボールを落として番号を揃えよう。</p>
        <button class="btn btn-primary" id="start-btn">🎱 20枚でスタート</button>
        <div class="release-row">
          <button class="btn btn-primary release-btn" id="release-btn" type="button" disabled>🎱 タップ</button>
          <button class="btn auto-release-btn" id="auto-release-btn" type="button">🔁 オート: OFF</button>
        </div>
        <p class="hint release-hint">オートOFFなら「タップ」で1球ずつ自分のタイミングで落とせます。オートONなら自動で連続投球。</p>
        <div class="stat-row">
          <div class="stat">
            <span class="stat-label">抽選回数</span>
            <span class="stat-value" id="draw-count">0 / 10</span>
          </div>
          <div class="stat">
            <span class="stat-label">直近の番号</span>
            <span class="stat-value gold" id="last-number">-</span>
          </div>
        </div>
        <p class="result-message" id="result-message"></p>
      </section>
    </div>
  </main>

  <script src="../../shared/medal-bank.js"></script>
  <script src="../../shared/jp-tickets.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.52.1"></script>
  <script src="../../shared/supabase-config.js"></script>
  <script src="../../shared/ranking.js"></script>
  <script src="../../shared/header.js"></script>
  <script src="bingo-ball.js"></script>
</body>
</html>
