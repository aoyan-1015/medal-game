<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>メダル落とし | メダルカジノ</title>
<link rel="stylesheet" href="../../shared/theme.css" />
<link rel="stylesheet" href="pusher.css" />
</head>
<body>
  <div id="app-header"></div>

  <main>
    <h1 class="page-title">🪙 メダル落とし</h1>

    <div class="layout">
      <section class="panel field-panel">
        <canvas id="field" width="480" height="640"></canvas>
      </section>

      <section class="panel control-panel">
        <h2>投入</h2>
        <p class="hint">メダル1枚 = 1投入。テーブル手前の端から落ちた分だけ獲得できます。</p>
        <div class="chip-row">
          <button class="btn btn-primary" id="drop1-btn">🪙 1枚投入</button>
          <button class="btn btn-primary" id="drop5-btn">🪙 5枚投入</button>
        </div>
        <p class="hint">テーブルをタップすると、その位置にメダルを投入できます。</p>
        <div class="stat-row">
          <div class="stat">
            <span class="stat-label">場のメダル</span>
            <span class="stat-value" id="field-count">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">今回の獲得</span>
            <span class="stat-value gold" id="session-won">0</span>
          </div>
        </div>
        <p class="note" id="field-note"></p>
      </section>
    </div>
  </main>

  <script src="../../shared/medal-bank.js"></script>
  <script src="../../shared/jp-tickets.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.52.1"></script>
  <script src="../../shared/supabase-config.js"></script>
  <script src="../../shared/ranking.js"></script>
  <script src="../../shared/header.js"></script>
  <script src="pusher.js"></script>
</body>
</html>
