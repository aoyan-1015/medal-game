<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JPルーレット | メダルカジノ</title>
<link rel="stylesheet" href="../../shared/theme.css" />
<link rel="stylesheet" href="jp-roulette.css" />
</head>
<body>
  <div id="app-header"></div>

  <main>
    <h1 class="page-title">🎡 JPルーレット</h1>
    <p class="jp-hint">
      スロットのジャックポットやメダル落としのボーナスコインを当てると「JP券」が貯まります。JP券を使ってこの巨大ルーレットに挑戦しよう。
    </p>

    <div class="jp-layout">
      <section class="panel wheel-panel">
        <div class="wheel-wrap">
          <div class="wheel-pointer">▼</div>
          <div class="wheel" id="wheel"></div>
        </div>
        <p class="wheel-result" id="wheel-result"></p>
      </section>

      <section class="panel control-panel">
        <div class="jp-ticket-count">
          <span class="stat-label">所持JP券</span>
          <span class="stat-value gold" id="ticket-count">0</span>
        </div>
        <button class="btn btn-primary spin-btn" id="spin-btn">🎡 JP券を1枚使ってスピン</button>
        <p class="hint" id="spin-hint"></p>

        <h2>景品一覧</h2>
        <ul class="prize-list" id="prize-list"></ul>
      </section>
    </div>
  </main>

  <script src="../../shared/medal-bank.js"></script>
  <script src="../../shared/jp-tickets.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.52.1"></script>
  <script src="../../shared/supabase-config.js"></script>
  <script src="../../shared/ranking.js"></script>
  <script src="../../shared/header.js"></script>
  <script src="jp-roulette.js"></script>
</body>
</html>
